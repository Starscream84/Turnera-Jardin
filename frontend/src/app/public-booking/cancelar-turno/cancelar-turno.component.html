<app-public-shell titulo="Cancelar un turno" [angosto]="true">
  <a routerLink="/reservar" class="enlace-volver">&larr; Volver al inicio</a>

  @if (cancelado()) {
    <div class="card" style="text-align: center;">
      <div class="icono-ok" aria-hidden="true"></div>
      <h2>Turno cancelado</h2>
      <p class="texto-suave">Tu turno fue cancelado correctamente.</p>
      <a routerLink="/reservar" class="btn btn-primario">Sacar un nuevo turno</a>
    </div>
  } @else {
    <p class="texto-suave" style="margin-bottom: 20px;">Ingresá el número de turno (te lo mostramos al confirmar la reserva) y el mismo WhatsApp con el que lo sacaste.</p>

    @if (error()) {
      <div class="alerta alerta-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="cancelar()" class="card">
      <div class="form-grupo">
        <label for="turnoId">Número de turno</label>
        <input id="turnoId" type="text" inputmode="numeric" formControlName="turnoId" />
      </div>

      <div class="form-grupo">
        <label for="telefono">Tu WhatsApp</label>
        <input id="telefono" type="tel" formControlName="telefono" />
      </div>

      <button type="submit" class="btn btn-peligro btn-bloque" [disabled]="enviando()">
        {{ enviando() ? 'Cancelando...' : 'Cancelar turno' }}
      </button>
    </form>
  }
</app-public-shell>
