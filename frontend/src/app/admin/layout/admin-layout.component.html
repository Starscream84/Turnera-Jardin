<div class="panel-top">
  <nav class="floating-nav" aria-label="Panel">
    <a routerLink="/admin/turnos" class="logo" aria-label="Panel — Turnera del Jardín">
      <span class="logo-idra">IDRA</span>
      <span class="logo-school">COLEGIO</span>
    </a>
    <div class="nav-links">
      <a routerLink="/admin/turnos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Turnos</a>
      @if (auth.role() === 'Admin' || auth.role() === 'Coordinator') {
        <a routerLink="/admin/turnos/generar" routerLinkActive="active" class="nav-link">Generar turnos</a>
        <a routerLink="/admin/docentes" routerLinkActive="active" class="nav-link">Docentes</a>
      }
      @if (auth.role() === 'Admin') {
        <a routerLink="/admin/usuarios" routerLinkActive="active" class="nav-link">Usuarios</a>
      }
      <a routerLink="/admin/mi-cuenta" routerLinkActive="active" class="nav-link">Mi contraseña</a>
    </div>
    <div class="nav-user">
      @if (auth.fullPhotoUrl()) {
        <img [src]="auth.fullPhotoUrl()" alt="" class="avatar" />
      } @else {
        <span class="avatar" aria-hidden="true">{{ initials(auth.userName()) }}</span>
      }
      <div class="nav-user-text">
        <strong>{{ auth.userName() }}</strong>
        <span>{{ roleLabel() }}</span>
      </div>
      <button type="button" class="btn btn-secondary btn-small" (click)="signOut()">Salir</button>
    </div>
  </nav>
</div>

<router-outlet />
