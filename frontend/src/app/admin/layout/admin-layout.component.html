<div class="panel-top">
  <nav class="nav-flotante" aria-label="Panel">
    <a routerLink="/admin/turnos" class="logo" aria-label="Panel — Turnera del Jardín">
      <span class="logo-idra">IDRA</span>
      <span class="logo-colegio">COLEGIO</span>
    </a>
    <div class="nav-links">
      <a routerLink="/admin/turnos" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Turnos</a>
      @if (auth.rol() === 'Admin' || auth.rol() === 'Coordinador') {
        <a routerLink="/admin/turnos/generar" routerLinkActive="activo" class="nav-link">Generar turnos</a>
        <a routerLink="/admin/docentes" routerLinkActive="activo" class="nav-link">Docentes</a>
      }
      @if (auth.rol() === 'Admin') {
        <a routerLink="/admin/usuarios" routerLinkActive="activo" class="nav-link">Usuarios</a>
      }
      <a routerLink="/admin/mi-cuenta" routerLinkActive="activo" class="nav-link">Mi contraseña</a>
    </div>
    <div class="nav-usuario">
      @if (auth.fotoUrlCompleta()) {
        <img [src]="auth.fotoUrlCompleta()" alt="" class="avatar" />
      } @else {
        <span class="avatar" aria-hidden="true">{{ iniciales(auth.nombreUsuario()) }}</span>
      }
      <div class="nav-usuario-texto">
        <strong>{{ auth.nombreUsuario() }}</strong>
        <span>{{ etiquetaRol() }}</span>
      </div>
      <button type="button" class="btn btn-secundario btn-chico" (click)="salir()">Salir</button>
    </div>
  </nav>
</div>

<router-outlet />
