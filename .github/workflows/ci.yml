name: CI

# Runs on every pull request and on every push to main: builds the backend, runs its tests
# and builds the frontend. If any step fails, the PR shows a red cross.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore TurneraJardin.sln
      - run: dotnet build TurneraJardin.sln --no-restore -c Release
      - run: dotnet test TurneraJardin.sln --no-build -c Release --verbosity normal
      - name: Vulnerable packages
        run: dotnet list TurneraJardin.Api/TurneraJardin.Api.csproj package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
